[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Frank Hoffmann", email = "15r10nk@polarbit.de"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy"
]
dependencies = [
    "libcst>=1.8.6",
]
description = "converts if-else code to match statements"
license = "MIT"
name = "matchify"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[dependency-groups]
cog = [
  "cogapp>=3.4.1",
]
dev = [
  "commitizen==4.16.5; python_version >= '3.10'",
  "coverage[toml]>=6.5",
  "inline-snapshot>=0.35.3",
  "pysource-minimize[cli]>=0.10.1",
  "pytest>=9.0.1",
  "scriv==1.8.0; python_version >= '3.10'",
]

[project.scripts]
matchify = "matchify.cli:main"

[project.urls]
Documentation = "https://github.com/15r10nk/matchify#readme"
Issues = "https://github.com/15r10nk/matchify/issues"
Source = "https://github.com/15r10nk/matchify"

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.commitizen]
major_version_zero = true
tag_format = "v$major.$minor.$patch$prerelease"
version_scheme = "semver2"
version_provider = "pep621"

[tool.scriv]
format = "md"

[tool.coverage.paths]
matchify = ["src/matchify", "*/matchify/src/matchify"]
tests = ["tests", "*/matchify/tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 100

[tool.coverage.run]
branch = true
data_file = "$TOP/.coverage"
omit = ["find_pattern_coverage_issue.py", "find_random_trace_issue.py"]
parallel = true
source = ["matchify"]

[tool.hatch.envs.default]
scripts.test = "pytest {args:tests}"
dependencies = [
  "pytest",
  "pytest-xdist"
]

[tool.hatch.envs.hatch-test]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-xdist"
]
env-vars.TOP = "{root}"
default-args = ["tests"]
scripts.run = "coverage run -m pytest {args}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]



[tool.hatch.envs.cov]
dependencies = ["coverage[toml]>=6.5"]
detached = true
env-vars.TOP = "{root}"
scripts.test = [
  "- coverage erase",
  "hatch test --cover-quiet {args}",
  "coverage combine",
  "coverage html",
  "coverage report"
]
