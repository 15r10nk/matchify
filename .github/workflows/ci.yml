name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', pypy3.11]

    env:
      TOP: ${{github.workspace}}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ./.github/actions/setup
      with:
        python-version: ${{matrix.python-version}}

    - run: |
        uv run -m coverage run -m pytest -q
    - run: |
        uv run -m coverage combine
        mv .coverage .coverage.${{ matrix.python-version }}-ubuntu-latest-${{strategy.job-index}}

    - name: Upload coverage data
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: coverage-data-${{github.run_id}}-${{ matrix.python-version }}-ubuntu-latest-${{strategy.job-index}}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

  platform-test:
    runs-on: ${{matrix.os}}
    timeout-minutes: 20

    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        is_insider:
        - ${{contains(github.repository, '-insiders/')}}
        exclude:
        - is_insider: true
          os: windows-latest
        - is_insider: true
          os: macos-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ./.github/actions/setup
      with:
        python-version: '3.14'

    - run: uv run -m pytest -q

  coverage:
    name: Combine & check coverage
    env:
      TOP: ${{github.workspace}}
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ./.github/actions/setup

    - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
      with:
        pattern: coverage-data-${{github.run_id}}-*
        merge-multiple: true

    - name: Combine coverage & fail if it's <100%
      run: |
        uv pip install --upgrade coverage[toml]

        coverage combine
        coverage html --skip-covered --skip-empty

        # Report and write to summary.
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

        # Report again and fail if under 100%.
        coverage report --fail-under=100

    - name: Upload HTML report if check failed
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: html-report
        path: htmlcov
      if: ${{ failure() }}


  publish:
    name: Publish new release
    runs-on: ubuntu-latest
    needs: [test, platform-test, coverage]
    if: github.event_name == 'push' && !contains(github.repository, '-insiders/')
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      # this permission is mandatory to create github releases
      contents: write

    steps:
    - name: Checkout main
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup

    - name: Check if the commit has a vx.y.z tag
      id: check-version
      run: |
        if git tag --list --points-at ${{ github.sha }} | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "is new version"
          echo "should_continue=true" >> "$GITHUB_OUTPUT"
        else
          echo "is not a new version"
          echo "should_continue=false" >> "$GITHUB_OUTPUT"
        fi

    - run: uv pip install hatch scriv
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}

    - name: build package
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}
      run: hatch build

    - name: Publish package distributions to PyPI
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4

    - name: create github release
      if: ${{ steps.check-version.outputs.should_continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: scriv github-release
