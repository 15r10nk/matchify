name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  detect_release:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{steps.release.outputs.is_release}}
      tag: ${{steps.release.outputs.tag}}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Detect merged release pull request
      id: release
      env:
        GH_TOKEN: ${{github.token}}
      run: |
        version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        release_branch="$(
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release/v")))][0].head.ref // ""'
        )"
        if test "$release_branch" = "release/v$version"; then
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
        else
          echo "is_release=false" >> "$GITHUB_OUTPUT"
        fi


  test:

    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', pypy3.11]

        os: [ubuntu-latest, windows-latest, macos-15]
        lowest_resolution: [false]
        is_insider:
        - ${{contains(github.repository, '-insiders/')}}

        exclude:
        - is_insider: true
          os: windows-latest
        - is_insider: true
          os: macos-15


        - os: macos-15
          python-version: '3.11'
        - os: windows-latest
          python-version: '3.11'

        - os: macos-15
          python-version: '3.12'
        - os: windows-latest
          python-version: '3.12'

        - os: macos-15
          python-version: '3.13'
        - os: windows-latest
          python-version: '3.13'

        - os: macos-15
          python-version: pypy3.11
        - os: windows-latest
          python-version: pypy3.11

        include:
        - os: ubuntu-latest
          python-version: '3.10'
          lowest_resolution: true
        - os: ubuntu-latest
          python-version: '3.14'
          lowest_resolution: true


    env:
      TOP: ${{github.workspace}}
      COVERAGE_PROCESS_START: ${{github.workspace}}/pyproject.toml
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ./.github/actions/setup
      with:
        python-version: ${{matrix.python-version}}

    - name: Resolve lowest direct dependencies
      if: matrix.lowest_resolution
      run: |
        uv lock --upgrade --resolution lowest-direct
        uv sync --locked --resolution lowest-direct
        uv pip install coverage coverage-enable-subprocess pytest pytest-xdist

    - name: Test locked dependencies
      if: ${{ !matrix.lowest_resolution }}
      run: uv run --locked --with coverage --with coverage-enable-subprocess --with pytest --with pytest-xdist -m ${{ matrix.os == 'ubuntu-latest' && 'coverage run -m' || '' }} pytest -n=auto -vv

    - name: Test lowest direct dependencies
      if: matrix.lowest_resolution
      run: uv run --no-sync -m coverage run -m pytest -n=auto -vv

    - run: |
        uv run ${{ matrix.lowest_resolution && '--no-sync' || '--with coverage' }} -m coverage combine
        mv .coverage .coverage.${{ matrix.python-version }}-${{matrix.os}}-${{strategy.job-index}}
      if: matrix.os == 'ubuntu-latest'

    - name: Upload coverage data
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-data-${{github.run_id}}-${{ matrix.python-version }}-${{matrix.os}}-${{strategy.job-index}}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

  coverage:
    name: Combine & check coverage
    env:
      TOP: ${{github.workspace}}
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ./.github/actions/setup

    - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
      with:
        pattern: coverage-data-${{github.run_id}}-*
        merge-multiple: true

    - name: Combine coverage & fail if it's <100%
      run: |
        uv run --with coverage coverage combine
        uv run --with coverage coverage html --skip-covered --skip-empty

        # Report and write to summary.
        uv run --with coverage coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

        # Report again and fail if under 100%.
        uv run --with coverage coverage report


    - name: Upload HTML report if check failed
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: html-report
        path: htmlcov
      if: ${{ failure() }}


  publish:
    name: Publish new release
    needs: [detect_release, test, coverage]
    if: needs.detect_release.outputs.is_release == 'true' && !contains(github.repository, '-insiders/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout tested commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        token: ${{secrets.PAT_WEEKLY_UPDATE}}

    - uses: ./.github/actions/setup
      with:
        python-version: '3.12'

    - name: Build distributions
      run: uvx hatch build

    - name: Tag tested commit
      env:
        TAG: ${{needs.detect_release.outputs.tag}}
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
        else
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
        fi

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
      with:
        skip-existing: true

    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{github.token}}
      run: uv run --locked scriv github-release --repo "$GITHUB_REPOSITORY"
